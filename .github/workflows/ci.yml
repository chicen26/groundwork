name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, format, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    # Row-level security policies and CHECK constraints cannot be tested against a fake database,
    # so CI always provides a real PostGIS. Locally these tests skip when no DSN is configured.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: groundwork
          POSTGRES_PASSWORD: groundwork
          POSTGRES_DB: groundwork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GROUNDWORK_TEST_DATABASE_URL: postgresql://groundwork:groundwork@localhost:5432/groundwork_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest

      - name: Fail if database tests were skipped
        # A silent skip would turn our privacy guarantees into untested claims.
        run: |
          pytest -q -m "" tests/test_row_level_security.py --collect-only >/dev/null
          pytest -q tests/test_row_level_security.py -p no:cacheprovider \
            | tee /tmp/rls.txt
          if grep -qi "skipped" /tmp/rls.txt; then
            echo "::error::row-level security tests skipped — the database service is not reachable"
            exit 1
          fi

  ml:
    name: ML — dataset and leakage guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        # Dataset assembly needs nothing heavy on purpose: the leakage guards must run on every
        # push, and waiting on torch would mean they eventually would not.
        run: pip install pytest

      - name: Test
        run: python -m pytest ml/tests

  mobile:
    name: Mobile — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Bundle
        # A typecheck does not catch a bad import path or a missing native module. Bundling does,
        # and it is the difference between "compiles" and "would actually open on a phone".
        run: npx expo export --platform ios --output-dir /tmp/expo-export

  docker:
    name: API — image builds and boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t groundwork-api:ci services/api

      - name: Boot the image and answer a request
        # Building proves the Dockerfile parses; it does not prove the image contains everything
        # the service needs. Startup validates the pinned rulebook, so a missing COPY only shows up
        # here.
        run: |
          docker run -d --name groundwork-ci -p 8000:8000 groundwork-api:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/v1/health > /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

      - name: Container logs on failure
        if: failure()
        run: docker logs groundwork-ci || true
