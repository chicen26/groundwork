name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, format, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    # Row-level security policies and CHECK constraints cannot be tested against a fake database,
    # so CI always provides a real PostGIS. Locally these tests skip when no DSN is configured.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: groundwork
          POSTGRES_PASSWORD: groundwork
          POSTGRES_DB: groundwork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundwork"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GROUNDWORK_TEST_DATABASE_URL: postgresql://groundwork:groundwork@localhost:5432/groundwork_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest

      - name: Fail if database tests were skipped
        # A silent skip would turn our privacy guarantees into untested claims.
        run: |
          pytest -q -m "" tests/test_row_level_security.py --collect-only >/dev/null
          pytest -q tests/test_row_level_security.py -p no:cacheprovider \
            | tee /tmp/rls.txt
          if grep -qi "skipped" /tmp/rls.txt; then
            echo "::error::row-level security tests skipped — the database service is not reachable"
            exit 1
          fi

  mobile:
    name: Mobile — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  docker:
    name: API — image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t groundwork-api:ci services/api
