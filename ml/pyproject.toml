[project]
name = "groundwork-ml"
version = "0.1.0"
description = "Dataset assembly, training, and evaluation for the Groundwork hazard detector"
requires-python = ">=3.12"
# Deliberately light: dataset assembly, the leakage guards, and the harvester's licence rules all
# run in CI in seconds. Training and auto-labelling import torch lazily via their own extras.
dependencies = [
    # Explicit CA bundle for the harvester's outbound HTTPS, rather than whatever the host trusts.
    "certifi>=2024.8.30",
]

[project.optional-dependencies]
train = ["ultralytics>=8.3"]
# Open-vocabulary pre-labelling. Heavy, and only needed once when preparing a dataset.
autolabel = ["transformers>=4.45", "torch>=2.4", "pillow>=11.0"]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["dataset", "train", "evaluate", "harvest", "autolabel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
