[project]
name = "groundwork-ml"
version = "0.1.0"
description = "Dataset assembly, training, and evaluation for the Groundwork hazard detector"
requires-python = ">=3.12"
# Dataset assembly and the leakage guards deliberately need nothing heavy, so they run in CI in
# seconds. Training and evaluation import ultralytics lazily; install the `train` extra for those.
dependencies = []

[project.optional-dependencies]
train = ["ultralytics>=8.3"]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["dataset", "train", "evaluate"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
