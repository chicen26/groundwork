[project]
name = "groundwork-api"
version = "0.1.0"
description = "Groundwork backend — geo resolution, rules engine, rebate math, inference orchestration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    # Explicit CA bundle: the stdlib falls back to whatever the host has, which on macOS python.org
    # builds is nothing. Layer imports must not depend on how Python was installed.
    "certifi>=2024.8.30",
    "pyjwt>=2.9",
    # Image decoding for EXIF stripping on upload.
    "pillow>=11.0",
    # FastAPI needs this to parse multipart photo uploads.
    "python-multipart>=0.0.9",
    # PDF generation. ReportLab rather than an HTML engine: no system libraries, so the container
    # that builds in CI is the one that renders the report on demo day.
    "reportlab>=4.2",
]

[project.optional-dependencies]
# Torch and Ultralytics are large and only the inference worker needs them, so the API image and
# the test suite stay light.
inference = [
    "ultralytics>=8.3",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Starlette's TestClient uses httpx2; httpx 0.x is deprecated for this path.
    "httpx2>=0.1",
    "ruff>=0.7",
    # Builds JPEGs carrying real EXIF so the stripping test proves something.
    "piexif>=1.1.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
