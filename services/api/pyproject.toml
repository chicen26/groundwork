[project]
name = "groundwork-api"
version = "0.1.0"
description = "Groundwork backend — geo resolution, rules engine, rebate math, inference orchestration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    # Explicit CA bundle: the stdlib falls back to whatever the host has, which on macOS python.org
    # builds is nothing. Layer imports must not depend on how Python was installed.
    "certifi>=2024.8.30",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Starlette's TestClient uses httpx2; httpx 0.x is deprecated for this path.
    "httpx2>=0.1",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
